name: Assemble brand icon

on:
  push:
    branches: [cursor/favicon-emblema-0809]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/favicon-emblema-0809
      - name: Assemble exact emblem JSON parts
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          fixes = {
              Path("lib/brand-icon-1-1.json"): ("PfZLC8sSEhrLj", "PfZLC8SEhrLj"),
              Path("lib/brand-icon-1-4.json"): ("zQtI/OKCOafPHOOyv2", "zQtO/OKCOafPHOOyv2"),
              Path("lib/brand-icon-1-5.json"): ("lFqd3pzA08", "lFqd3vzA08"),
          }
          for path, (old, new) in fixes.items():
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  print(f"patched {path}")
              else:
                  print(f"no patch needed {path}")

          for i in (1, 2, 3):
              parts = []
              for j in range(1, 6):
                  chunk = Path(f"lib/brand-icon-{i}-{j}.json")
                  if not chunk.exists():
                      raise SystemExit(f"missing {chunk}")
                  parts.append(json.loads(chunk.read_text())["p"])
              Path(f"lib/brand-icon-{i}.json").write_text('{"p": "' + "".join(parts) + '"}\n')
          print("assembled brand-icon-1/2/3.json")
          PY
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/brand-icon-1.json lib/brand-icon-2.json lib/brand-icon-3.json lib/brand-icon-1-1.json lib/brand-icon-1-4.json lib/brand-icon-1-5.json
          if git diff --cached --quiet; then
            echo "No assembled-file changes"
          else
            git commit -m "Add Carreras Asturias emblem JSON parts."
            git push origin cursor/favicon-emblema-0809
          fi
